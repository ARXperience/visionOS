name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    # Base efimera: solo la usa prisma migrate diff como shadow para
    # comprobar que las migraciones y el esquema describen lo mismo.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # R4 del plan: el ERP de Servimil versiona su esquema con parches sueltos
      # y no se puede levantar desde cero. Aqui no se repite.
      #
      # Una sola comprobacion, y es la precisa: que aplicar las migraciones
      # produzca exactamente el esquema declarado. Antes habia ademas un grep
      # de "cambio schema.prisma sin tocar migrations/", pero da falsos
      # positivos en cambios que no son de modelo (anadir directUrl al
      # datasource, por ejemplo) y una regla que grita en falso se termina
      # ignorando.
      - name: Migraciones al dia con el esquema
        run: |
          cd apps/api
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code && echo "sin deriva"
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow

      - run: npm run build

      # jest --passWithNoTests esta prohibido: es como el ERP acabo sin tests.
      - name: No se admite --passWithNoTests
        run: |
          if grep -rn -- "--passWithNoTests" --include=package.json --include="jest.config*" . ; then
            echo "::error::--passWithNoTests reintroducido. Escriba la prueba."
            exit 1
          fi

      - run: npm test
