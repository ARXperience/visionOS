name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    # Base efimera: solo la usa prisma migrate diff como shadow para
    # comprobar que las migraciones y el esquema describen lo mismo.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # R4 del plan: el ERP de Servimil versiona su esquema con parches sueltos
      # y no se puede levantar desde cero. Aqui no se repite.
      #
      # Una sola comprobacion, y es la precisa: que aplicar las migraciones
      # produzca exactamente el esquema declarado. Antes habia ademas un grep
      # de "cambio schema.prisma sin tocar migrations/", pero da falsos
      # positivos en cambios que no son de modelo (anadir directUrl al
      # datasource, por ejemplo) y una regla que grita en falso se termina
      # ignorando.
      #
      # La unica excepcion es persons_doc_idx: btree con varchar_pattern_ops,
      # que Prisma no sabe declarar y siempre propone borrar. Es la misma que
      # filtra scripts/migracion.mjs; cualquier otra diferencia falla.
      - name: Migraciones al dia con el esquema
        run: |
          cd apps/api
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script > deriva.sql
          if grep -vE '^\s*$|^--|DROP INDEX "persons_doc_idx"' deriva.sql; then
            echo "::error::schema.prisma y las migraciones no describen lo mismo"
            exit 1
          fi
          echo "sin deriva"
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow

      # Sin base, las pruebas de integracion se saltan solas y el CI sale
      # verde sin haber tocado PostgreSQL. Algunas necesitan profesionales y
      # salas: por eso SEED_DEMO.
      - name: Base de pruebas
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database visionos"
          npm run prisma:generate --workspace apps/api
          npm run migrate:deploy --workspace apps/api
          SEED_DEMO=1 npm run seed --workspace apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visionos
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visionos

      - run: npm run build

      # jest --passWithNoTests esta prohibido: es como el ERP acabo sin tests.
      - name: No se admite --passWithNoTests
        run: |
          if grep -rn -- "--passWithNoTests" --include=package.json --include="jest.config*" . ; then
            echo "::error::--passWithNoTests reintroducido. Escriba la prueba."
            exit 1
          fi

      # S3 falso a proposito: firmar una URL de subida no sale a la red, y
      # sin credenciales las pruebas del filtro de archivos se saltan.
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visionos
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visionos
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: prueba
          S3_SECRET_ACCESS_KEY: prueba
